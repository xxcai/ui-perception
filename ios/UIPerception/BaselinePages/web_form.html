<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Form Baseline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    h1 { font-size: 24px; margin: 16px 0 8px; }
    h2 { font-size: 18px; margin: 24px 0 8px; color: #555; }
    form {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #666;
      margin: 12px 0 4px;
    }
    input[type="text"], input[type="email"], input[type="password"], select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font-size: 15px;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      background: #007aff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 15px;
      margin-right: 8px;
      margin-top: 12px;
    }
    button.secondary { background: #e5e5ea; color: #1d1d1f; }
    ul {
      background: #fff;
      padding: 16px 16px 16px 36px;
      border-radius: 12px;
      margin: 0 0 16px;
    }
    li { padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    li:last-child { border-bottom: none; }
    a { color: #007aff; text-decoration: none; }
    .tabbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tabbar a {
      padding: 6px 12px;
      background: #fff;
      border-radius: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>Web Form Baseline</h1>
  <p>用于验证 iOS WKWebView 抓取链路。结构对应 Android native 消息首页，便于跨端 diff。</p>

  <div class="tabbar">
    <a href="#form">表单</a>
    <a href="#list">列表</a>
    <a href="#links">链接</a>
  </div>

  <h2 id="form">用户注册表单</h2>
  <form>
    <label for="username">用户名</label>
    <input id="username" name="username" type="text" placeholder="请输入用户名">

    <label for="email">邮箱</label>
    <input id="email" name="email" type="email" placeholder="example@domain.com">

    <label for="password">密码</label>
    <input id="password" name="password" type="password" placeholder="至少 8 位">

    <label for="dept">部门</label>
    <select id="dept" name="dept">
      <option value="tech">技术部</option>
      <option value="product">产品部</option>
      <option value="design">设计部</option>
    </select>

    <label for="bio">个人简介</label>
    <textarea id="bio" name="bio" placeholder="一句话介绍自己"></textarea>

    <button type="submit">提交</button>
    <button type="reset" class="secondary">重置</button>
  </form>

  <h2 id="list">消息列表</h2>
  <ul>
    <li><strong>梁晓舟</strong> — 明天上班</li>
    <li><strong>苏芸</strong> — 刚到工位</li>
    <li><strong>周霖</strong> — 在开会</li>
    <li><strong>孙瀚</strong> — 外出</li>
    <li><strong>李妍</strong> — 请假</li>
    <li><strong>韩辰</strong> — 在线</li>
  </ul>

  <h2 id="links">相关链接</h2>
  <p>
    <a href="#form">回到表单</a> ·
    <a href="#list">查看列表</a> ·
    <a href="https://example.com/about" target="_blank">关于本页面</a>
  </p>
</body>
</html>
