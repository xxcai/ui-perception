name: UIPerception
options:
  bundleIdPrefix: com.hh.uiperception
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  UIPerception:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: UIPerception
        excludes:
          - "**/.DS_Store"
    resources:
      - paths:
          - UIPerception/Capture/dom-serializer.js
          - UIPerception/BaselinePages/web_form.html
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hh.uiperception.ios
        PRODUCT_NAME: UIPerception
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: UIPerception/App/Info.plist
    info:
      path: UIPerception/App/Info.plist
      properties:
        CFBundleDisplayName: UIPerception
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: 用于保存抓取结果到相册
schemes:
  UIPerception:
    build:
      targets:
        UIPerception: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
